<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <!-- Enterprise Hero Banner -->
  <div class="jumbotron text-center">
    <h2>ApexShield Health Systems</h2>
    <p class="lead">Production Kubernetes Workload • Spring Boot &amp; PostgreSQL Microservices</p>
    <div style="margin-top: 20px;">
      <a class="btn btn-primary btn-lg" th:href="@{/owners/find}">
        <span class="fa fa-search"></span> Search Patients
      </a>
      <a class="btn btn-default btn-lg" th:href="@{/vets.html}" style="margin-left: 10px;">
        <span class="fa fa-user-md"></span> On-Call Vets
      </a>
    </div>
  </div>

  <!-- Operational Status Dashboard Cards -->
  <div class="row" style="margin-bottom: 25px;">
    <div class="col-md-4">
      <div class="panel panel-default text-center" style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 15px;">
        <div class="panel-body">
          <small class="text-muted" style="text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Cluster Gateway</small>
          <h3 class="text-success" style="margin-top: 5px; font-weight: bold;">
            <span class="fa fa-check-circle"></span> NGINX Ingress
          </h3>
          <small class="text-muted">Azure Load Balancer</small>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="panel panel-default text-center" style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 15px;">
        <div class="panel-body">
          <small class="text-muted" style="text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Target Environment</small>
          <h3 class="text-primary" style="margin-top: 5px; font-weight: bold;">
            <span class="fa fa-cubes"></span> AKS Dev
          </h3>
          <small class="text-muted">East US Region</small>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="panel panel-default text-center" style="border-radius: 8px; border: 1px solid #e2e8f0; padding: 15px;">
        <div class="panel-body">
          <small class="text-muted" style="text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Database Engine</small>
          <h3 class="text-info" style="margin-top: 5px; font-weight: bold;">
            <span class="fa fa-database"></span> PostgreSQL
          </h3>
          <small class="text-muted">Internal ClusterIP</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Pet Banner Asset -->
  <div class="text-center">
    <img class="img-responsive center-block" th:src="@{/resources/images/pets.png}" alt="Pets" style="max-height: 180px; border-radius: 6px;"/>
  </div>

</body>
</html>
