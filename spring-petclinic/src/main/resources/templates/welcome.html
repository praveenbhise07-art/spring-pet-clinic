<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body})}">

<body>

  <!-- Modern Hero Section -->
  <div class="p-5 mb-4 bg-dark text-white rounded-3 shadow-sm border border-secondary">
    <div class="container-fluid py-3 text-center">
      <span class="badge bg-primary mb-2 px-3 py-2 text-uppercase fs-6">Enterprise Cloud Platform</span>
      <h1 class="display-4 fw-bold">ApexShield Health Systems</h1>
      <p class="col-md-8 fs-5 mx-auto text-light opacity-75">
        Production Kubernetes Workload • Spring Boot & PostgreSQL Microservices
      </p>
      <div class="d-flex justify-content-center gap-3 mt-4">
        <a class="btn btn-primary btn-lg shadow-sm" th:href="@{/owners/find}" role="button">
          <i class="fa fa-search me-1"></i> Search Patients
        </a>
        <a class="btn btn-outline-light btn-lg shadow-sm" th:href="@{/vets.html}" role="button">
          <i class="fa fa-user-md me-1"></i> On-Call Vets
        </a>
      </div>
    </div>
  </div>

  <!-- Operational Status Dashboard -->
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card h-100 border-0 shadow-sm text-center p-3">
        <div class="card-body">
          <div class="text-uppercase text-muted fw-bold small mb-2">Cluster Gateway</div>
          <h4 class="text-success fw-bold mb-0">
            <i class="fa fa-check-circle me-1"></i> NGINX Ingress
          </h4>
          <small class="text-secondary">Azure LB Connected</small>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 border-0 shadow-sm text-center p-3">
        <div class="card-body">
          <div class="text-uppercase text-muted fw-bold small mb-2">Target Cluster</div>
          <h4 class="text-primary fw-bold mb-0">
            <i class="fa fa-cubes me-1"></i> AKS Dev
          </h4>
          <small class="text-secondary">East US Region</small>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100 border-0 shadow-sm text-center p-3">
        <div class="card-body">
          <div class="text-uppercase text-muted fw-bold small mb-2">Database Engine</div>
          <h4 class="text-info fw-bold mb-0">
            <i class="fa fa-database me-1"></i> PostgreSQL
          </h4>
          <small class="text-secondary">Internal ClusterIP</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Petclinic Banner Image Container -->
  <div class="text-center mt-4">
    <img class="img-fluid rounded-3 shadow-sm border" th:src="@{/resources/images/pets.png}" alt="Pets" style="max-height: 220px;"/>
  </div>

</body>
</html>
