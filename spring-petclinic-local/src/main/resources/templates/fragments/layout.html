<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:fragment="layout (template, menu)">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>PetClinic :: a Spring Framework demonstration</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <!-- Local PetClinic CSS -->
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />

  <style>
    /* Force high contrast navbar styling */
    nav.navbar {
      background-color: #1a1e21 !important;
      border-bottom: 2px solid #0d6efd;
    }
    nav.navbar .navbar-brand,
    nav.navbar .navbar-brand span {
      color: #ffffff !important;
      font-weight: 700 !important;
    }
    nav.navbar .nav-link,
    nav.navbar .nav-link i,
    nav.navbar .nav-link span {
      color: #e0e0e0 !important;
      font-weight: 600 !important;
    }
    nav.navbar .nav-link:hover,
    nav.navbar .nav-link.active {
      color: #38bdf8 !important;
    }
    nav.navbar .nav-link:hover i,
    nav.navbar .nav-link.active i {
      color: #38bdf8 !important;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- HEADER NAVIGATION -->
  <nav class="navbar navbar-expand-lg py-3 shadow-lg">
    <div class="container-fluid px-4">
      
      <!-- Brand & Logo -->
      <a class="navbar-brand d-flex align-items-center gap-2 me-5" th:href="@{/}">
        <img th:src="@{/resources/images/spring-logo.svg}" 
             alt="Spring Logo" 
             style="height: 32px; width: auto;" />
        <span class="fs-4 ms-2">PetClinic</span>
      </a>

      <!-- Mobile Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
              aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 text-uppercase fs-6">
          <li class="nav-item me-4">
            <a class="nav-link" th:href="@{/}" th:classappend="${menu == 'home'} ? 'active'">
              <i class="fa fa-home me-2"></i>Home
            </a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link" th:href="@{/owners/find}" th:classappend="${menu == 'owners'} ? 'active'">
              <i class="fa fa-search me-2"></i>Find Owners
            </a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link" th:href="@{/vets.html}" th:classappend="${menu == 'vets'} ? 'active'">
              <i class="fa fa-user-md me-2"></i>Veterinarians
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/oups}" th:classappend="${menu == 'error'} ? 'active'">
              <i class="fa fa-exclamation-triangle me-2"></i>Error Test
            </a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-shrink-0">
    <div class="container-fluid p-0">
      <th:block th:replace="${template}" />
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center">
      <span class="text-muted">Spring PetClinic Application</span>
    </div>
  </footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
