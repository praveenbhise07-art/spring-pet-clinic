<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
</head>
<body>

  <!-- HEADER NAVIGATION FRAGMENT -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2" th:fragment="navbar">
    <div class="container-fluid px-4">
      
      <!-- Brand & Logo Container (Fixed Overlap) -->
      <a class="navbar-brand d-flex align-items-center gap-2 me-4" th:href="@{/}">
        <img th:src="@{/resources/images/spring-logo.svg}" 
             src="../static/resources/images/spring-logo.svg" 
             alt="Spring Logo" 
             style="height: 32px; width: auto;" />
        <span class="fw-bold text-white fs-5" style="letter-spacing: 0.5px;">PetClinic</span>
      </a>

      <!-- Mobile Toggle Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
              aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav Links -->
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 text-uppercase fs-7 fw-semibold">
          <li class="nav-item me-2">
            <a class="nav-link" th:href="@{/}">
              <i class="fa fa-home me-1"></i> Home
            </a>
          </li>
          <li class="nav-item me-2">
            <a class="nav-link" th:href="@{/owners/find}">
              <i class="fa fa-search me-1"></i> Find Owners
            </a>
          </li>
          <li class="nav-item me-2">
            <a class="nav-link" th:href="@{/vets.html}">
              <i class="fa fa-user-md me-1"></i> Veterinarians
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/oups}">
              <i class="fa fa-exclamation-triangle me-1"></i> Error Test
            </a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

</body>
</html>
