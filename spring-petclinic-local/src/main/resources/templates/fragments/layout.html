<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:fragment="html (content, title)">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title th:text="${title}">PetClinic</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold fs-4" th:href="@{/}">🐾 PetClinic</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fs-5">
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/owners/find}">Find Owners</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" th:href="@{/vets.html}">Veterinarians</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/oups}">Error Test</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Fluid Container (Fills Wide Screens) -->
    <main class="container-fluid px-lg-5 my-4 flex-grow-1">
        <div th:replace="${content}">
            <p>Page content goes here...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container-fluid px-lg-5">
            <p class="text-muted mb-0">&copy; Spring Petclinic | Dedicated to Animal Health</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
